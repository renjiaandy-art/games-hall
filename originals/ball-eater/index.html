<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>大球吃小球</title></head><body>
<script src="../common/rj-game.js"></script>
<script>
(() => {
  'use strict';
  const W = 360, H = 640;
  const WORLD_R = 1000;
  const SCALE = 4.0; // radius = SCALE * sqrt(mass)
  const START_MASS = 22, MIN_SPLIT_MASS = 34, MIN_EJECT_MASS = 26, EJECT_AMOUNT = 5;
  const MERGE_COOLDOWN = 9, SPLIT_BOOST = 260;
  const TARGET_AI = 20, MAX_FOOD = 600;
  const EAT_RATIO = 1.15;

  const NAMES = ['小圆', '胖乎乎', '滚滚', '小可爱', '泡泡', '弹弹', '溜溜球', '大胃王', '小饭团', '圆滚滚',
    '闪光球', '跳跳糖', '棉花糖', '小汤圆', '冲冲球', '软软球', '蹦蹦球', '光球侠', '小汉堡', '圆圆', '大力球', '滑溜球'];
  const HUES = [4, 18, 32, 48, 96, 140, 170, 200, 220, 260, 285, 320, 340, 12, 60];

  RJ.init({
    id: 'ball-eater', title: '大球吃小球', icon: '🔵', subtitle: '吃光点变大，别被大球吃掉',
    howto: '• 左下摇杆拖动控制移动方向<br>• 吃光点和比自己小的球会变大变慢<br>• 被比自己大很多的球吃掉游戏结束<br>• 「分裂」把自己一分为二，更灵活但更易被吃；「吐球」吐出一点质量<br>• 尽量吃到最大，冲上排行榜第一',
    onStart: () => startGame(), onRestart: () => startGame(),
  });
  const view = RJ.canvas(W, H), ctx = view.ctx;
  const pill = RJ.pills(['mass', 'rank']);

  // ---------- spatial grid ----------
  function makeGrid(cell) {
    const map = new Map();
    const key = (cx, cy) => cx + ',' + cy;
    return {
      clear() { map.clear(); },
      insert(x, y, item) {
        const k = key(Math.floor(x / cell), Math.floor(y / cell));
        let a = map.get(k); if (!a) { a = []; map.set(k, a); }
        a.push(item);
      },
      query(x, y, r) {
        const out = [];
        const c0x = Math.floor((x - r) / cell), c1x = Math.floor((x + r) / cell);
        const c0y = Math.floor((y - r) / cell), c1y = Math.floor((y + r) / cell);
        for (let cx = c0x; cx <= c1x; cx++) for (let cy = c0y; cy <= c1y; cy++) {
          const a = map.get(key(cx, cy));
          if (a) for (const it of a) out.push(it);
        }
        return out;
      },
    };
  }
  const foodGrid = makeGrid(140), ballGrid = makeGrid(140);

  // ---------- helpers ----------
  function randDisk(maxR) {
    const r = maxR * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }
  const radOf = (mass) => SCALE * Math.sqrt(mass);
  const speedOf = (mass) => Math.max(38, 150 * Math.pow(22 / mass, 0.32));

  let pieces, ais, food, running, camX, camY, zoom, uid, score;

  function makeFood(x, y) {
    const val = Math.random() < 0.9 ? RJ.rand(1, 2) : RJ.rand(3, 5);
    return { x, y, r: 3 + val * 0.9, val, hue: HUES[RJ.randi(0, HUES.length - 1)] };
  }
  function spawnFood() {
    if (food.length >= MAX_FOOD) return;
    const p = randDisk(WORLD_R * 0.96);
    food.push(makeFood(p.x, p.y));
  }

  function makeBall(isPlayer, x, y, mass, name) {
    return {
      id: uid++, isPlayer, x, y, vx: 0, vy: 0, mass, r: radOf(mass),
      hue: isPlayer ? 128 : HUES[RJ.randi(0, HUES.length - 1)], name: name || NAMES[RJ.randi(0, NAMES.length - 1)],
      mergeT: 0, boostT: 0, bx: 0, by: 0, alive: true, respawnT: null, behavior: Math.random() < 0.5 ? 'hunt' : 'wander',
    };
  }

  const SAFE_R = 260;
  function spawnAI() {
    let p;
    for (let tries = 0; tries < 6; tries++) {
      p = randDisk(WORLD_R * 0.8);
      const nearPlayer = pieces && pieces.some((pl) => Math.hypot(pl.x - p.x, pl.y - p.y) < SAFE_R);
      if (!nearPlayer) break;
    }
    const mass = RJ.rand(8, 38);
    ais.push(makeBall(false, p.x, p.y, mass));
  }

  function startGame() {
    uid = 1; running = true; food = []; ais = []; score = 0;
    pieces = [makeBall(true, 0, 0, START_MASS, '你')];
    for (let i = 0; i < TARGET_AI; i++) spawnAI();
    for (let i = 0; i < MAX_FOOD * 0.75; i++) spawnFood();
    joyActive = false; zoom = 1;
    RJ.toast('开吃！', 1000);
  }

  // ---------- controls ----------
  let joyActive = false, joyDx = 0, joyDy = 0;
  const JOY_R = 46;
  const padWrap = document.createElement('div');
  padWrap.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px calc(env(safe-area-inset-bottom) + 20px);pointer-events:none';
  const padZone = document.createElement('div');
  padZone.style.cssText = 'width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);position:relative;pointer-events:auto;touch-action:none';
  const knob = document.createElement('div');
  knob.style.cssText = 'position:absolute;width:56px;height:56px;left:47px;top:47px;border-radius:50%;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.5)';
  padZone.appendChild(knob);
  const btnCol = document.createElement('div');
  btnCol.style.cssText = 'display:flex;flex-direction:column;gap:12px;pointer-events:none';
  const splitBtn = document.createElement('div');
  splitBtn.textContent = '分裂';
  const ejectBtn = document.createElement('div');
  ejectBtn.textContent = '吐球';
  const roundBtnCss = 'width:64px;height:64px;border-radius:50%;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;-webkit-user-select:none;user-select:none;touch-action:none;border:1px solid rgba(255,255,255,.5)';
  splitBtn.style.cssText = roundBtnCss + 'background:rgba(90,160,255,.75)';
  ejectBtn.style.cssText = roundBtnCss + 'background:rgba(255,152,60,.75)';
  btnCol.appendChild(splitBtn); btnCol.appendChild(ejectBtn);
  padWrap.appendChild(padZone); padWrap.appendChild(btnCol); document.body.appendChild(padWrap);

  function joyFrom(e) {
    const r = padZone.getBoundingClientRect();
    const p = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
    return { x: p.clientX - (r.left + r.width / 2), y: p.clientY - (r.top + r.height / 2) };
  }
  function joyStart(e) { e.preventDefault(); joyActive = true; RJ.unlockAudio(); joyMove(e); }
  function joyMove(e) {
    if (!joyActive) return; e.preventDefault();
    const v = joyFrom(e);
    const d = Math.hypot(v.x, v.y) || 1, k = Math.min(1, d / JOY_R);
    joyDx = (v.x / d) * k; joyDy = (v.y / d) * k;
    knob.style.left = (47 + joyDx * JOY_R * 0.55) + 'px';
    knob.style.top = (47 + joyDy * JOY_R * 0.55) + 'px';
  }
  function joyEnd(e) { e.preventDefault(); joyActive = false; joyDx = 0; joyDy = 0; knob.style.left = '47px'; knob.style.top = '47px'; }
  padZone.addEventListener('pointerdown', (e) => { padZone.setPointerCapture(e.pointerId); joyStart(e); });
  padZone.addEventListener('pointermove', joyMove);
  padZone.addEventListener('pointerup', joyEnd); padZone.addEventListener('pointercancel', joyEnd);

  function doSplit() {
    if (!running || pieces.length >= 2) return;
    const p = pieces[0];
    if (p.mass < MIN_SPLIT_MASS) { RJ.toast('太小了，先吃大一点'); return; }
    RJ.unlockAudio();
    const half = p.mass / 2;
    p.mass = half; p.r = radOf(half); p.mergeT = MERGE_COOLDOWN;
    const dir = (joyDx || joyDy) ? Math.atan2(joyDy, joyDx) : Math.atan2(p.by, p.bx) || 0;
    const nb = makeBall(true, p.x, p.y, half, '你');
    nb.mergeT = MERGE_COOLDOWN; nb.boostT = 0.4; nb.bx = Math.cos(dir) * SPLIT_BOOST; nb.by = Math.sin(dir) * SPLIT_BOOST;
    pieces.push(nb);
    RJ.sfx('shoot');
  }
  function doEject() {
    if (!running) return;
    let did = false;
    for (const p of pieces) {
      if (p.mass < MIN_EJECT_MASS) continue;
      did = true;
      p.mass -= EJECT_AMOUNT; p.r = radOf(p.mass);
      const dir = (joyDx || joyDy) ? Math.atan2(joyDy, joyDx) : 0;
      const fx = p.x + Math.cos(dir) * (p.r + 14), fy = p.y + Math.sin(dir) * (p.r + 14);
      food.push({ x: fx, y: fy, r: 3 + EJECT_AMOUNT * 0.9, val: EJECT_AMOUNT, hue: HUES[3] });
    }
    if (did) RJ.sfx('pop'); else RJ.toast('质量不够，吐不出来');
  }
  const stop = (e) => e.preventDefault();
  splitBtn.addEventListener('pointerdown', (e) => { stop(e); doSplit(); });
  ejectBtn.addEventListener('pointerdown', (e) => { stop(e); doEject(); });
  document.addEventListener('keydown', (e) => { if (e.key === ' ') doSplit(); else if (e.key === 'e' || e.key === 'E') doEject(); });

  // ---------- leaderboard ----------
  const lbEl = document.createElement('div');
  lbEl.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top) + 48px);right:10px;z-index:20;width:136px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.32);font-size:11.5px;line-height:1.55;pointer-events:none';
  document.body.appendChild(lbEl);
  let lbT = 0;
  function updateLeaderboard(dt, allBalls) {
    lbT -= dt; if (lbT > 0) return; lbT = 0.4;
    const byOwner = new Map();
    for (const b of allBalls) {
      const key = b.isPlayer ? 'you' : b.id;
      const rec = byOwner.get(key) || { mass: 0, isPlayer: b.isPlayer, name: b.name };
      rec.mass += b.mass; byOwner.set(key, rec);
    }
    const top = Array.from(byOwner.values()).sort((a, b) => b.mass - a.mass).slice(0, 5);
    let html = '<b>排行榜</b><br>';
    top.forEach((r, i) => { html += `${i + 1}. ${r.isPlayer ? '<span style="color:#ffd94a">你</span>' : r.name} ${Math.round(r.mass)}<br>`; });
    lbEl.innerHTML = html;
  }

  // ---------- update ----------
  function moveBall(b, dx, dy, dt) {
    const spd = speedOf(b.mass);
    b.x += dx * spd * dt; b.y += dy * spd * dt;
    if (b.boostT > 0) {
      b.boostT -= dt;
      const k = Math.max(0, b.boostT / 0.4);
      b.x += b.bx * k * dt; b.y += b.by * k * dt;
    }
    const dist = Math.hypot(b.x, b.y);
    const maxD = WORLD_R - b.r;
    if (dist > maxD && maxD > 0) { const k = maxD / dist; b.x *= k; b.y *= k; }
  }

  function aiThink(b) {
    const nearBalls = ballGrid.query(b.x, b.y, 220);
    let threat = null, threatD = 1e9, prey = null, preyD = 1e9;
    for (const o of nearBalls) {
      if (o === b) continue;
      const d = Math.hypot(o.x - b.x, o.y - b.y);
      if (o.mass > b.mass * EAT_RATIO && d < threatD) { threatD = d; threat = o; }
      else if (b.mass > o.mass * EAT_RATIO && d < preyD) { preyD = d; prey = o; }
    }
    if (threat && threatD < 200) return { x: b.x - threat.x, y: b.y - threat.y };
    if (prey && preyD < 220) return { x: prey.x - b.x, y: prey.y - b.y };
    const nearFood = foodGrid.query(b.x, b.y, 150);
    if (nearFood.length) {
      let best = null, bd = 1e9;
      for (const f of nearFood) { const d = (f.x - b.x) ** 2 + (f.y - b.y) ** 2; if (d < bd) { bd = d; best = f; } }
      if (best) return { x: best.x - b.x, y: best.y - b.y };
    }
    const a = (b.id * 1.7 + performance.now() * 0.00035) % (Math.PI * 2);
    return { x: Math.cos(a), y: Math.sin(a) };
  }

  function eatCheck(a, b) {
    // returns true if a eats b
    if (a.mass < b.mass * EAT_RATIO) return false;
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    return d < a.r - b.r * 0.35;
  }

  function update(dt) {
    const allBalls = pieces.concat(ais.filter((a) => a.alive));
    updateLeaderboard(dt, allBalls);
    if (!running) return;

    for (const p of pieces) {
      let dx = 0, dy = 0;
      if (joyActive && (joyDx || joyDy)) { dx = joyDx; dy = joyDy; }
      moveBall(p, dx, dy, dt);
      p.mergeT = Math.max(0, p.mergeT - dt);
    }
    for (const a of ais) {
      if (!a.alive) { if (a.respawnT != null) { a.respawnT -= dt; if (a.respawnT <= 0) a.respawnT = -1; } continue; }
      const dir = aiThink(a);
      const dlen = Math.hypot(dir.x, dir.y) || 1;
      moveBall(a, dir.x / dlen, dir.y / dlen, dt);
    }

    // player self-merge
    if (pieces.length === 2) {
      const [p0, p1] = pieces;
      const d = Math.hypot(p0.x - p1.x, p0.y - p1.y);
      if (p0.mergeT <= 0 && p1.mergeT <= 0 && d < (p0.r + p1.r) * 0.5) {
        p0.mass += p1.mass; p0.r = radOf(p0.mass); p0.x = (p0.x + p1.x) / 2; p0.y = (p0.y + p1.y) / 2;
        pieces = [p0];
      }
    }

    // rebuild grids
    foodGrid.clear(); for (const f of food) foodGrid.insert(f.x, f.y, f);
    ballGrid.clear();
    const liveBalls = pieces.concat(ais.filter((a) => a.alive));
    for (const b of liveBalls) ballGrid.insert(b.x, b.y, b);

    // eat food
    for (const b of liveBalls) {
      const near = foodGrid.query(b.x, b.y, b.r + 8);
      for (const f of near) {
        if (f.eaten) continue;
        if (Math.hypot(f.x - b.x, f.y - b.y) < b.r) { f.eaten = true; b.mass += f.val; b.r = radOf(b.mass); if (b.isPlayer) RJ.sfx('pop'); }
      }
    }
    food = food.filter((f) => !f.eaten);
    while (food.length < MAX_FOOD * 0.6) spawnFood();

    // ball vs ball eating
    for (const b of liveBalls) {
      if (b.eaten) continue;
      const near = ballGrid.query(b.x, b.y, b.r + 40);
      for (const o of near) {
        if (o === b || o.eaten) continue;
        if (eatCheck(b, o)) {
          o.eaten = true; b.mass += o.mass * 0.85; b.r = radOf(b.mass);
          if (b.isPlayer) RJ.sfx('coin'); else if (o.isPlayer) RJ.sfx('bad');
        }
      }
    }

    // resolve eaten AIs
    for (const a of ais) {
      if (a.eaten && a.alive) { a.alive = false; a.respawnT = RJ.rand(1.2, 2.6); }
    }
    // resolve eaten player pieces
    const survivors = pieces.filter((p) => !p.eaten);
    if (survivors.length < pieces.length) RJ.sfx('bad');
    pieces = survivors;
    if (pieces.length === 0 && running) {
      running = false;
      RJ.over({ title: '被吃掉了', sub: '下次躲远一点，吃得更大再冒险', score: Math.round(score) });
    }

    ais = ais.filter((a) => a.respawnT !== -1);
    const alive = ais.filter((a) => a.alive).length;
    const pending = ais.filter((a) => a.respawnT != null && a.respawnT > 0).length;
    if (alive + pending < TARGET_AI) spawnAI();

    if (pieces.length) {
      score = pieces.reduce((s, p) => s + p.mass, 0);
      camX = pieces.reduce((s, p) => s + p.x, 0) / pieces.length;
      camY = pieces.reduce((s, p) => s + p.y, 0) / pieces.length;
      const totalR = radOf(score);
      const targetZoom = Math.max(0.55, Math.min(1.15, 60 / totalR));
      zoom += (targetZoom - zoom) * Math.min(1, dt * 2.5);
      const others = new Map();
      for (const a of ais) if (a.alive) others.set(a.id, (others.get(a.id) || 0) + a.mass);
      const rank = 1 + Array.from(others.values()).filter((m) => m > score).length;
      pill('mass', `质量 ${Math.round(score)}`); pill('rank', `第 ${rank} 名`);
    }
  }

  // ---------- draw ----------
  function inView(x, y, pad) {
    const half = (Math.max(W, H) / 2) / zoom + pad;
    return x > camX - half && x < camX + half && y > camY - half && y < camY + half;
  }
  function drawBall(b) {
    if (!inView(b.x, b.y, b.r + 10)) return;
    ctx.fillStyle = `hsl(${b.hue},75%,${b.isPlayer ? 62 : 52}%)`;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
    if (b.r > 10) {
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `${Math.min(14, b.r * 0.4)}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(b.isPlayer ? '你' : b.name, b.x, b.y + 4);
    }
  }
  function draw() {
    ctx.save(); ctx.fillStyle = '#101229'; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1 / zoom;
    const gs = 60, x0 = Math.floor((camX - W) / gs) * gs, y0 = Math.floor((camY - H) / gs) * gs;
    ctx.beginPath();
    for (let x = x0; x < camX + W; x += gs) { ctx.moveTo(x, camY - H); ctx.lineTo(x, camY + H); }
    for (let y = y0; y < camY + H; y += gs) { ctx.moveTo(camX - W, y); ctx.lineTo(camX + W, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,70,70,.85)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(0, 0, WORLD_R, 0, Math.PI * 2); ctx.stroke();
    for (const f of food) { if (!inView(f.x, f.y, 10)) continue; ctx.fillStyle = `hsl(${f.hue},85%,62%)`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
    for (const a of ais) if (a.alive) drawBall(a);
    for (const p of pieces) drawBall(p);
    ctx.restore();
  }

  startGame(); running = false;
  RJ.loop(update, draw);
})();
</script></body></html>
