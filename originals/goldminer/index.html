<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>挖金子</title></head><body>
<script src="../common/rj-game.js"></script>
<script>
(() => {
  const W = 360, H = 600, OX = 180, OY = 92, GROUND = 128;
  const TYPES = {
    goldS: { r: 11, v: 60, w: 0.6, kind: 'gold' }, goldM: { r: 19, v: 180, w: 1.6, kind: 'gold' }, goldL: { r: 31, v: 520, w: 4.2, kind: 'gold' },
    rockS: { r: 15, v: 20, w: 2.2, kind: 'rock' }, rockL: { r: 25, v: 50, w: 5, kind: 'rock' },
    gem: { r: 8, v: 650, w: 0.3, kind: 'gem' }, bag: { r: 13, v: 0, w: 1, kind: 'bag' },
  };
  let level, score, time, target, items, hook, running, float = [];
  const view = RJ.canvas(W, H), ctx = view.ctx;
  RJ.init({
    id: 'goldminer', title: '挖金子', icon: '⛏️', subtitle: '把钩子甩准，挖到足够多的金子就过关',
    howto: '• <b>点击屏幕</b> / 空格 / ↓ 放出钩子<br>• 金块越大越值钱但拉得越慢，石头不值钱还很重<br>• 💎 钻石最值钱；❓ 神秘袋金额随机<br>• 每关 60 秒，分数达到目标就进入下一关',
    onStart: () => startLevel(1, 0), onRestart: () => startLevel(1, 0),
  });
  const pill = RJ.pills(['lv', 'goal', 'score', 'time']);

  function place(n, kinds) {
    const out = [];
    for (const k of kinds) for (let i = 0; i < n[k]; i++) {
      const t = TYPES[k];
      for (let tries = 0; tries < 200; tries++) {
        const x = RJ.rand(t.r + 6, W - t.r - 6), y = RJ.rand(GROUND + 40 + t.r, H - t.r - 8);
        if (out.every((o) => Math.hypot(o.x - x, o.y - y) > o.r + t.r + 8)) {
          out.push({ type: k, ...t, x, y, v: k === 'bag' ? RJ.randi(2, 16) * 50 : t.v, rot: Math.random() * 6 });
          break;
        }
      }
    }
    return out;
  }
  function startLevel(lv, carry) {
    level = lv; score = carry; time = 60; target = carry + 400 + lv * 280;
    const n = { goldL: Math.min(1 + (lv >> 1), 4), goldM: 3 + (lv % 3), goldS: 5, rockL: 1 + Math.min(lv, 4), rockS: 2 + (lv >> 1), gem: lv > 1 ? 1 + (lv >> 2) : 0, bag: 2 };
    items = place(n, ['goldL', 'rockL', 'goldM', 'rockS', 'goldS', 'gem', 'bag']);
    hook = { ang: 0, t: 0, len: 0, state: 'swing', item: null };
    running = true; float = [];
    RJ.toast(`第 ${lv} 关 · 目标 ${target}`, 1500);
  }
  function fire() { if (running && hook.state === 'swing') { hook.state = 'out'; RJ.sfx('move'); } }
  view.onPointer(() => fire());
  addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'ArrowDown') fire(); });

  function tip() { return { x: OX + Math.sin(hook.ang) * (18 + hook.len), y: OY + Math.cos(hook.ang) * (18 + hook.len) }; }
  function update(dt) {
    float = float.filter((f) => (f.t += dt) < 1);
    if (!running) return;
    time -= dt;
    if (hook.state === 'swing') { hook.t += dt; hook.ang = Math.sin(hook.t * 1.6) * 1.25; }
    else if (hook.state === 'out') {
      hook.len += 330 * dt;
      const p = tip();
      if (p.x < 0 || p.x > W || p.y > H) hook.state = 'back';
      for (const it of items) if (Math.hypot(it.x - p.x, it.y - p.y) < it.r + 6) { hook.item = it; hook.state = 'back'; RJ.sfx('hit'); break; }
    } else if (hook.state === 'back') {
      const speed = hook.item ? 330 / (1 + hook.item.w) : 520;
      hook.len -= speed * dt;
      if (hook.item) { const p = tip(); hook.item.x = p.x + Math.sin(hook.ang) * hook.item.r * 0.6; hook.item.y = p.y + Math.cos(hook.ang) * hook.item.r * 0.6; }
      if (hook.len <= 0) {
        hook.len = 0; hook.state = 'swing';
        if (hook.item) {
          const v = hook.item.v; score += v; items = items.filter((i) => i !== hook.item);
          float.push({ txt: '+' + v, x: OX + 40, y: OY - 10, t: 0, c: v >= 300 ? '#7ef9ff' : v >= 100 ? '#ffd84a' : '#ddd' });
          RJ.sfx(v >= 100 ? 'coin' : 'pop'); hook.item = null;
        }
      }
    }
    if (time <= 0 || (!items.some((i) => i.kind !== 'rock') && hook.state === 'swing')) {
      running = false; time = Math.max(0, time);
      if (score >= target) RJ.over({ title: '过关！', sub: `第 ${level} 关完成，累计金额`, score, win: true, next: () => startLevel(level + 1, score) });
      else RJ.over({ title: '时间到', sub: `还差 ${target - score} 分就能过第 ${level} 关`, score });
    }
  }
  function drawItem(it) {
    ctx.save(); ctx.translate(it.x, it.y);
    if (it.kind === 'gold') {
      const g = ctx.createRadialGradient(-it.r * .3, -it.r * .35, it.r * .1, 0, 0, it.r);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(.45, '#ffcc1f'); g.addColorStop(1, '#b77a00');
      ctx.fillStyle = g; ctx.beginPath();
      for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2 + it.rot, rr = it.r * (0.86 + 0.14 * Math.sin(i * 2.3 + it.rot)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
    } else if (it.kind === 'rock') {
      ctx.fillStyle = '#7d7f88'; ctx.beginPath();
      for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2 + it.rot, rr = it.r * (0.8 + 0.2 * Math.cos(i * 1.7)); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(-it.r * .3, -it.r * .3, it.r * .3, 0, 7); ctx.fill();
    } else if (it.kind === 'gem') {
      ctx.fillStyle = '#6ff3ff'; ctx.beginPath(); ctx.moveTo(0, -it.r * 1.3); ctx.lineTo(it.r, 0); ctx.lineTo(0, it.r * 1.3); ctx.lineTo(-it.r, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.globalAlpha = .7; ctx.beginPath(); ctx.moveTo(0, -it.r * 1.1); ctx.lineTo(it.r * .4, 0); ctx.lineTo(0, 0); ctx.fill(); ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = '#b07a45'; RJ.rr(ctx, -it.r, -it.r * .8, it.r * 2, it.r * 1.8, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${it.r * 1.2}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, it.r * .1);
    }
    ctx.restore();
  }
  function draw() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, '#6ec3ff'); sky.addColorStop(1, '#bfe6ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);
    const dirt = ctx.createLinearGradient(0, GROUND, 0, H); dirt.addColorStop(0, '#9b6a3d'); dirt.addColorStop(1, '#4d2f1a');
    ctx.fillStyle = dirt; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc((i * 97) % W, GROUND + 20 + (i * 53) % (H - GROUND), 3 + (i % 4), 0, 7); ctx.fill(); }
    ctx.fillStyle = '#5fbf4a'; ctx.fillRect(0, GROUND - 8, W, 10);
    // miner: winch + little figure
    ctx.fillStyle = '#5a3b22'; RJ.rr(ctx, OX - 34, OY - 26, 68, 24, 6); ctx.fill();
    ctx.fillStyle = '#c9c9c9'; ctx.beginPath(); ctx.arc(OX, OY - 14, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcc99'; ctx.beginPath(); ctx.arc(OX + 46, OY - 44, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8412c'; RJ.rr(ctx, OX + 36, OY - 34, 20, 28, 5); ctx.fill();
    ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.arc(OX + 46, OY - 50, 10, Math.PI, 0); ctx.fill();
    items.forEach(drawItem);
    // rope + claw
    const p = tip();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(OX, OY - 10); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-hook.ang); ctx.strokeStyle = '#444'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const open = hook.item ? 0.25 : 0.55;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12 * Math.cos(open), 12); ctx.moveTo(0, 0); ctx.lineTo(12 * Math.cos(open), 12); ctx.stroke(); ctx.restore();
    if (hook.item && hook.item !== null) drawItem(hook.item);
    for (const f of float) { ctx.globalAlpha = 1 - f.t; ctx.fillStyle = f.c; ctx.font = 'bold 20px sans-serif'; ctx.fillText(f.txt, f.x, f.y - f.t * 30); ctx.globalAlpha = 1; }
    pill('lv', `第${level || 1}关`); pill('goal', `目标 ${target || 0}`); pill('score', `💰 ${score || 0}`); pill('time', `⏱ ${Math.ceil(Math.max(0, time || 0))}`);
  }
  level = 1; score = 0; time = 60; target = 0; items = place({ goldL: 1, goldM: 3, goldS: 5, rockL: 2, rockS: 2, gem: 0, bag: 1 }, ['goldL', 'rockL', 'goldM', 'rockS', 'goldS', 'gem', 'bag']);
  hook = { ang: 0, t: 0, len: 0, state: 'swing', item: null }; running = false;
  RJ.loop((dt) => { if (!running && hook.state === 'swing') { hook.t += dt; hook.ang = Math.sin(hook.t * 1.6) * 1.25; } update(dt); }, draw);
})();
</script></body></html>
