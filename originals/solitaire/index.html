<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d3b24">
<link rel="icon" href="data:,">
<title>纸牌接龙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#1c6b46 0%,#0d3b24 55%,#082518 100%);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px)}
.topbar{display:flex;align-items:center;gap:8px;flex:none}
.topbar a,.topbar button{color:#fff;text-decoration:none;font-size:13px;padding:7px 11px;border-radius:11px;background:rgba(255,255,255,.14);border:none;font-family:inherit}
.topbar h1{font-size:16px;font-weight:700;flex:1;text-align:center;letter-spacing:1px}
.hud{display:flex;gap:8px;margin:6px 0;flex:none;font-variant-numeric:tabular-nums}
.hud .pill{flex:1;text-align:center;padding:5px 4px;border-radius:10px;background:rgba(0,0,0,.22);font-size:12.5px;font-weight:600}
.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.row{display:grid;gap:4px;flex:none}
.row.top{grid-template-columns:repeat(8,1fr)}
.tableau{flex:1;min-height:0;display:grid;grid-template-rows:1fr;gap:4px;position:relative}
.tableau.k{grid-template-columns:repeat(7,1fr)}
.tableau.f{grid-template-columns:repeat(8,1fr)}
.pile{position:relative;border-radius:6px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);aspect-ratio:5/7}
.col{position:relative;height:100%;border-radius:6px;background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);min-height:40px}
.card{position:absolute;left:2%;width:96%;aspect-ratio:5/7;border-radius:7%;background:#f4f1e8;color:#1a1a1a;
  box-shadow:0 2px 5px rgba(0,0,0,.4);transition:box-shadow .12s,filter .12s;display:flex;flex-direction:column;justify-content:space-between;
  padding:3% 4%;font-weight:800;cursor:pointer}
.card.red{color:#c22}
.card .cnr{font-size:clamp(9px,3.6vw,15px);line-height:1;white-space:nowrap}
.card .cnr.bl{align-self:flex-end;transform:rotate(180deg)}
.card .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(14px,7vw,28px);opacity:.9}
.card.sel{filter:brightness(1.18);box-shadow:0 0 0 3px #ffd65a,0 6px 14px rgba(0,0,0,.5);transform:translateY(-4px)}
.card.drag{z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.55);filter:brightness(1.1)}
.card.back{background:repeating-linear-gradient(135deg,#1e5f8f,#1e5f8f 5px,#164a70 5px,#164a70 10px);border:2px solid rgba(255,255,255,.35)}
.pile.foundation::after{content:attr(data-suit);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,7vw,30px);opacity:.28;pointer-events:none}
.pile.free::after{content:'自由';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.3;pointer-events:none}
.pile.stock{cursor:pointer}
.pile.stock::after{content:'↺';position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:22px;opacity:.4}
.pile.stock.empty::after{display:flex}
.controls{display:flex;gap:6px;margin-top:6px;flex:none}
.controls button{flex:1;font-family:inherit;font-size:13px;font-weight:700;color:#fff;border:none;border-radius:11px;padding:9px 4px;background:rgba(255,255,255,.16)}
.controls button:active{filter:brightness(1.2)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,10,10,.6);z-index:40;overflow:auto;touch-action:pan-y}
.overlay.hidden{display:none}
.card-panel{width:100%;max-width:400px;padding:24px 22px;border-radius:26px;background:rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.2);text-align:center}
.card-panel h2{font-size:26px;letter-spacing:3px;margin-bottom:6px}
.card-panel .sub{opacity:.75;font-size:13.5px;margin-bottom:14px}
.rules{text-align:left;font-size:13px;line-height:1.65;background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.seg{display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px;margin-bottom:12px}
.seg button{font-family:inherit;font-size:14.5px;font-weight:600;padding:10px;border:none;border-radius:11px;background:none;color:rgba(255,255,255,.75);cursor:pointer}
.seg button.sel{background:rgba(255,255,255,.92);color:#0d3b24}
.record{font-size:12.5px;opacity:.75;margin-bottom:14px;line-height:1.6}
.col2{display:flex;flex-direction:column;gap:9px}
button.btn{font-family:inherit;font-size:15.5px;font-weight:700;color:#fff;border:none;border-radius:13px;padding:11px;cursor:pointer;background:rgba(255,255,255,.16)}
a.btn{display:block;text-decoration:none;font-size:15.5px;font-weight:700;color:#fff;border-radius:13px;padding:11px;background:rgba(255,255,255,.16)}
.btn.primary{background:linear-gradient(180deg,#3ad07a,#0e9c4d);box-shadow:0 8px 20px rgba(14,156,77,.4)}
.big{font-size:34px;font-weight:800;margin:8px 0 2px}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.72);
  font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a href="../">‹ 大厅</a>
    <h1 id="modeTitle">纸牌接龙</h1>
    <button id="menuBtn">菜单</button>
  </div>
  <div class="hud">
    <div class="pill">⏱ <span id="hudTime">00:00</span></div>
    <div class="pill">步数 <span id="hudMoves">0</span></div>
    <div class="pill" id="hudExtra">胜率 0%</div>
  </div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button id="undoBtn">↶ 撤销</button>
    <button id="autoBtn">⚡ 自动收牌</button>
    <button id="newBtn">↻ 新局</button>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="card-panel">
    <h2>🃏 纸牌接龙</h2>
    <div class="sub">经典接龙 · 空当接龙</div>
    <div class="rules">
      <b>经典接龙</b>：把牌按黑红交替、点数递减的顺序移到牌桌列上；A→K 按花色收集到右上角完成牌堆即胜。翻 1 或翻 3 张控制发牌方式，牌堆用完可循环。<br>
      <b>空当接龙</b>：无发牌堆，4 个自由格可暂存任意单张牌；空列可放任意牌；开局<b>保证有解</b>。<br>
      <b>操作</b>：点击一张牌再点击目标位置即可移动，也可直接拖拽；双击可尝试快速归位。
    </div>
    <div class="seg" id="modeSeg">
      <button data-m="k1">经典接龙 · 翻1张</button>
      <button data-m="k3">经典接龙 · 翻3张</button>
      <button data-m="f">空当接龙</button>
    </div>
    <div class="record" id="record"></div>
    <div class="col2">
      <button class="btn primary" id="startBtn">开始游戏</button>
      <a class="btn" href="../">返回大厅</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="card-panel">
    <h2 id="endTitle">🎉 胜利！</h2>
    <div class="big" id="endTime">00:00</div>
    <div class="sub" id="endSub"></div>
    <div class="record" id="endRecord"></div>
    <div class="col2">
      <button class="btn primary" id="againBtn">再来一局</button>
      <button class="btn" id="toMenuBtn">更换玩法</button>
      <a class="btn" href="../">返回大厅</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script src="ui.js"></script>
</body>
</html>
