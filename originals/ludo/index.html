<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#152238">
<link rel="icon" href="data:,">
<title>飞行棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#2a3a63 0%,#152238 55%,#0c1524 100%);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 6px);gap:6px}
.topbar{display:flex;align-items:center;gap:8px;flex:none}
.topbar a,.topbar button{color:#fff;text-decoration:none;font-size:13px;padding:7px 11px;border-radius:11px;background:rgba(255,255,255,.14);border:none;font-family:inherit}
.topbar h1{font-size:16px;font-weight:700;flex:1;text-align:center;letter-spacing:1px}
.hud{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.hud .chip{flex:1;min-width:70px;text-align:center;padding:6px 4px;border-radius:10px;background:rgba(0,0,0,.22);font-size:12px;font-weight:700;border:2px solid transparent}
.hud .chip.turn{border-color:#ffd65a;box-shadow:0 0 0 2px rgba(255,214,90,.18)}
.hud .chip .n{opacity:.8;font-weight:500;font-size:10.5px}
.status{text-align:center;font-size:13.5px;min-height:18px;flex:none;opacity:.92}
.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.controls{display:flex;gap:6px;flex:none}
.controls button{flex:1;font-family:inherit;font-size:13px;font-weight:700;color:#fff;border:none;border-radius:11px;padding:10px 4px;background:rgba(255,255,255,.16)}
.controls button:disabled{opacity:.4}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,20,.6);z-index:40;overflow:auto;touch-action:pan-y}
.overlay.hidden{display:none}
.card-panel{width:100%;max-width:400px;padding:24px 22px;border-radius:26px;background:rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.2);text-align:center}
.card-panel h2{font-size:26px;letter-spacing:3px;margin-bottom:6px}
.card-panel .sub{opacity:.75;font-size:13.5px;margin-bottom:14px}
.rules{text-align:left;font-size:12.8px;line-height:1.6;background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px;margin-bottom:10px}
.seg button{flex:1;font-family:inherit;font-size:14.5px;font-weight:600;padding:9px;border:none;border-radius:11px;background:none;color:rgba(255,255,255,.75);cursor:pointer}
.seg button.sel{background:rgba(255,255,255,.92);color:#152238}
.seatlist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.seatrow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border-radius:12px;padding:6px 10px}
.seatrow .dot{width:14px;height:14px;border-radius:50%;flex:none}
.seatrow .lbl{flex:1;text-align:left;font-size:13.5px;font-weight:600}
.seatrow .tgl{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:9px;padding:2px}
.seatrow .tgl button{font-family:inherit;font-size:12px;font-weight:700;padding:6px 10px;border:none;border-radius:7px;background:none;color:rgba(255,255,255,.7)}
.seatrow .tgl button.sel{background:rgba(255,255,255,.9);color:#152238}
.record{font-size:12px;opacity:.75;margin-bottom:14px;line-height:1.6}
.col2{display:flex;flex-direction:column;gap:9px}
button.btn{font-family:inherit;font-size:15.5px;font-weight:700;color:#fff;border:none;border-radius:13px;padding:11px;cursor:pointer;background:rgba(255,255,255,.16)}
a.btn{display:block;text-decoration:none;font-size:15.5px;font-weight:700;color:#fff;border-radius:13px;padding:11px;background:rgba(255,255,255,.16)}
.btn.primary{background:linear-gradient(180deg,#5fb0ff,#1a72e0);box-shadow:0 8px 20px rgba(26,114,224,.4)}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.72);
  font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;white-space:nowrap;text-align:center;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a href="../">‹ 大厅</a>
    <h1>飞行棋</h1>
    <button id="menuBtn">菜单</button>
  </div>
  <div class="hud" id="hud"></div>
  <div class="status" id="status">&nbsp;</div>
  <div class="boardwrap"><canvas id="board"></canvas></div>
  <div class="controls">
    <button id="rollBtn">🎲 掷骰</button>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="card-panel">
    <h2>✈️ 飞行棋</h2>
    <div class="sub">四色对战 · 掷骰起飞 · 抢先到达终点</div>
    <div class="rules">
      掷出 <b>6</b> 才能从机场起飞上路；棋子按公共跑道前进，走到与自己出发点距离一圈处转入专属跑道，精确点数才能到达终点。<br>
      落在<b>同色跳跃格</b>会额外向前跳跃；落在<b>飞行捷径</b>格会跳得更远。<br>
      走到有对方棋子的格子（出发点安全格除外）会把对方撞回机场。掷出 6 可再掷一次，连续 3 个 6 作废本轮。<br>
      率先让 4 枚棋子全部抵达终点者获胜。
    </div>
    <div class="seg" id="countSeg">
      <button data-n="2">2人</button>
      <button data-n="3">3人</button>
      <button data-n="4">4人</button>
    </div>
    <div class="seatlist" id="seatList"></div>
    <div class="record" id="record"></div>
    <div class="col2">
      <button class="btn primary" id="startBtn">开始游戏</button>
      <a class="btn" href="../">返回大厅</a>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOv">
  <div class="card-panel">
    <h2 id="endTitle">🎉 游戏结束</h2>
    <div class="sub" id="endSub"></div>
    <div class="record" id="endRecord"></div>
    <div class="col2">
      <button class="btn primary" id="againBtn">再来一局</button>
      <button class="btn" id="toMenuBtn">更换设置</button>
      <a class="btn" href="../">返回大厅</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script src="ui.js"></script>
</body>
</html>
