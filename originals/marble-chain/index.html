<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>珠链消除</title></head><body>
<script src="../common/rj-game.js"></script>
<script>
(() => {
  'use strict';
  const W = 360, H = 640, RADIUS = 13, SPACING = RADIUS * 2;
  const LAUNCH = { x: W / 2, y: H / 2 - 10 };
  const COLORS = ['#e0524a', '#f0ad4e', '#f4e03c', '#5cc75c', '#4fa8ff', '#b46ee0'];
  const SHOT_SPEED = 460;

  const LEVELS = [
    { name: '蜿蜒小径', points: [[40, 70], [320, 70], [320, 230], [40, 230], [40, 390], [320, 390], [320, 550], [160, 610]],
      speed: 32, colorCount: 4, queueLen: 22, fill: 9, spawnInterval: 1.6 },
    { name: '折返隧道', points: [[320, 60], [60, 60], [60, 180], [320, 180], [320, 300], [60, 300], [60, 420], [320, 420], [320, 540], [160, 600]],
      speed: 38, colorCount: 5, queueLen: 28, fill: 10, spawnInterval: 1.4 },
    { name: '密纹回廊', points: [[180, 50], [320, 90], [300, 190], [80, 170], [50, 260], [300, 270], [320, 360], [60, 350], [50, 440], [300, 450], [320, 540], [100, 560], [120, 610]],
      speed: 44, colorCount: 5, queueLen: 34, fill: 11, spawnInterval: 1.25 },
  ];

  RJ.init({
    id: 'marble-chain', title: '珠链消除', icon: '🔮', subtitle: '击中同色珠链，3 个以上相连即可消除',
    howto: '• 点击画面任意位置，中间发射器会朝那个方向射出彩珠<br>' +
      '• 键盘：←→ 调整瞄准方向，空格发射<br>' +
      '• 彩珠插入珠链后，3 个及以上同色相连会消除，消除后珠链闭合可能连锁反应<br>' +
      '• 珠链头部到达终点（漩涡）即告失败，清空全部彩珠（含后续供给）即可过关',
    onStart: () => startLevel(0, 0), onRestart: () => startLevel(curLevel || 0, 0),
  });
  const view = RJ.canvas(W, H), ctx = view.ctx;
  const pill = RJ.pills(['lv', 'score', 'left']);

  let curLevel, path, level, score, running, elapsed;
  let chain, frontArc, queue, spawnTimer;
  let currentBall, nextBall, flying, cooldown, aimAngle, particles;

  // ---- Catmull-Rom path build ----
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return {
      x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
      y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
    };
  }
  function buildPath(rawPoints) {
    const pts = rawPoints.map((p) => ({ x: p[0], y: p[1] }));
    const ext = [pts[0], ...pts, pts[pts.length - 1]];
    const samples = [];
    const stepsPerSeg = 24;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = ext[i], p1 = ext[i + 1], p2 = ext[i + 2], p3 = ext[i + 3];
      for (let s = 0; s < stepsPerSeg; s++) samples.push(catmullRom(p0, p1, p2, p3, s / stepsPerSeg));
    }
    samples.push(pts[pts.length - 1]);
    const cum = [0];
    for (let i = 1; i < samples.length; i++) cum.push(cum[i - 1] + Math.hypot(samples[i].x - samples[i - 1].x, samples[i].y - samples[i - 1].y));
    return { samples, cum, maxLen: cum[cum.length - 1] };
  }
  function pathPoint(s) {
    const cum = path.cum, n = cum.length;
    if (s <= 0) return path.samples[0];
    if (s >= path.maxLen) return path.samples[n - 1];
    let lo = 0, hi = n - 1;
    while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
    const segLen = cum[hi] - cum[lo] || 1;
    const t = (s - cum[lo]) / segLen;
    const a = path.samples[lo], b = path.samples[hi];
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }
  function nearestS(px, py) {
    let best = 0, bd = Infinity;
    const samples = path.samples, cum = path.cum;
    for (let i = 0; i < samples.length; i++) {
      const d = (samples[i].x - px) ** 2 + (samples[i].y - py) ** 2;
      if (d < bd) { bd = d; best = cum[i]; }
    }
    return best;
  }

  function genQueue(n, colorCount) {
    const seq = [];
    for (let i = 0; i < n; i++) {
      let c;
      do { c = RJ.randi(0, colorCount - 1); } while (seq.length >= 2 && seq[seq.length - 1] === c && seq[seq.length - 2] === c);
      seq.push(c);
    }
    return seq;
  }

  function chainMarbleS(i) { return frontArc - i * SPACING; }

  function startLevel(lv, sc) {
    if (lv >= LEVELS.length) lv = 0;
    curLevel = lv; level = LEVELS[lv]; score = sc; running = true; elapsed = 0;
    path = buildPath(level.points);
    queue = genQueue(level.queueLen, level.colorCount);
    chain = [];
    for (let i = 0; i < level.fill && queue.length; i++) chain.push({ color: queue.shift() });
    frontArc = (chain.length - 1) * SPACING;
    spawnTimer = level.spawnInterval;
    currentBall = RJ.randi(0, level.colorCount - 1);
    nextBall = RJ.randi(0, level.colorCount - 1);
    flying = null; cooldown = 0; aimAngle = -Math.PI / 2; particles = [];
    RJ.toast(`第 ${lv + 1} 关 · ${level.name}`, 1300);
  }

  function fire(angle) {
    if (!running || flying || cooldown > 0) return;
    flying = { x: LAUNCH.x, y: LAUNCH.y, vx: Math.cos(angle) * SHOT_SPEED, vy: Math.sin(angle) * SHOT_SPEED, color: currentBall };
    currentBall = nextBall; nextBall = RJ.randi(0, level.colorCount - 1);
    cooldown = 0.12;
    RJ.sfx('shoot');
  }

  view.onPointer((p) => {
    aimAngle = Math.atan2(p.y - LAUNCH.y, p.x - LAUNCH.x);
    fire(aimAngle);
  }, null, null);

  function processMatches(startIdx) {
    let k = startIdx, cascades = 0;
    while (true) {
      if (k < 0) k = 0;
      if (k >= chain.length) break;
      const color = chain[k].color;
      let lo = k, hi = k;
      while (lo - 1 >= 0 && chain[lo - 1].color === color) lo--;
      while (hi + 1 < chain.length && chain[hi + 1].color === color) hi++;
      if (hi - lo + 1 < 3) break;
      for (let i = lo; i <= hi; i++) {
        const pt = pathPoint(chainMarbleS(i));
        particles.push({ x: pt.x, y: pt.y, color, t: 0 });
      }
      score += (hi - lo + 1) * 15 * (1 + cascades);
      chain.splice(lo, hi - lo + 1);
      cascades++;
      RJ.sfx('pop');
      k = Math.min(lo, chain.length - 1);
      if (k < 0) break;
    }
    return cascades > 0;
  }

  function settleShot() {
    let hitIdx = -1, hitDist = Infinity;
    for (let i = 0; i < chain.length; i++) {
      const pt = pathPoint(chainMarbleS(i));
      const d = Math.hypot(pt.x - flying.x, pt.y - flying.y);
      if (d < hitDist) { hitDist = d; hitIdx = i; }
    }
    if (hitIdx < 0 || hitDist > RADIUS * 1.9) return false;
    const hitS = nearestS(flying.x, flying.y);
    const k = hitS > chainMarbleS(hitIdx) ? hitIdx : hitIdx + 1;
    chain.splice(k, 0, { color: flying.color });
    RJ.sfx('hit');
    flying = null;
    processMatches(k);
    return true;
  }

  function update(dt) {
    particles = particles.filter((p) => (p.t += dt) < 0.35);
    if (cooldown > 0) cooldown -= dt;
    if (!running) return;
    elapsed += dt;
    const spd = level.speed * (1 + Math.min(0.6, elapsed * 0.012));
    frontArc += spd * dt;

    if (queue.length) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { chain.push({ color: queue.shift() }); spawnTimer = level.spawnInterval; }
    }

    if (flying) {
      flying.x += flying.vx * dt; flying.y += flying.vy * dt;
      if (settleShot()) { /* handled */ }
      else if (flying && (flying.x < -30 || flying.x > W + 30 || flying.y < -30 || flying.y > H + 30)) flying = null;
    }

    if (chain.length === 0 && queue.length === 0) {
      running = false;
      RJ.over({ title: '过关！', sub: `第 ${curLevel + 1} 关 · ${level.name}`, score, win: true,
        next: curLevel + 1 < LEVELS.length ? () => startLevel(curLevel + 1, score) : null });
      return;
    }
    if (chain.length > 0 && frontArc >= path.maxLen) {
      running = false;
      RJ.over({ title: '珠链到达终点', sub: `第 ${curLevel + 1} 关 · ${level.name}`, score });
    }
  }

  function pollKeys() {
    if (RJ.keys['ArrowLeft']) aimAngle -= 2.2 * (1 / 60);
    if (RJ.keys['ArrowRight']) aimAngle += 2.2 * (1 / 60);
  }
  let spaceLatch = false;
  function pollFireKey() {
    const down = RJ.keys[' ']; if (down && !spaceLatch) fire(aimAngle); spaceLatch = down;
  }

  function drawMarble(x, y, color, scale) {
    scale = scale || 1;
    const g = ctx.createRadialGradient(x - RADIUS * 0.3, y - RADIUS * 0.35, RADIUS * 0.15, x, y, RADIUS * scale);
    g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(0.3, color); g.addColorStop(1, color);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, RADIUS * scale - 1, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1; ctx.stroke();
  }

  function drawPath() {
    const s = path.samples;
    ctx.strokeStyle = '#2a3050'; ctx.lineWidth = RADIUS * 2 + 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y); for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x, s[i].y); ctx.stroke();
    ctx.strokeStyle = '#1a1f38'; ctx.lineWidth = RADIUS * 2 + 2; ctx.stroke();
    const goal = s[s.length - 1];
    const g = ctx.createRadialGradient(goal.x, goal.y, 2, goal.x, goal.y, 20);
    g.addColorStop(0, '#e0524a'); g.addColorStop(1, '#4a1010');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(goal.x, goal.y, 18, 0, 7); ctx.fill();
    const start = s[0];
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(start.x, start.y, 16, 0, 7); ctx.fill();
  }

  function draw() {
    ctx.fillStyle = '#181c33'; ctx.fillRect(0, 0, W, H);
    drawPath();
    for (let i = 0; i < chain.length; i++) {
      const pt = pathPoint(chainMarbleS(i));
      drawMarble(pt.x, pt.y, COLORS[chain[i].color], 1);
    }
    for (const p of particles) { ctx.globalAlpha = 1 - p.t / 0.35; drawMarble(p.x, p.y, COLORS[p.color], 1 + p.t * 2.5); ctx.globalAlpha = 1; }

    // launcher
    ctx.fillStyle = '#2a3050'; ctx.beginPath(); ctx.arc(LAUNCH.x, LAUNCH.y, 24, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke();
    if (running) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.setLineDash([5, 6]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(LAUNCH.x, LAUNCH.y);
      ctx.lineTo(LAUNCH.x + Math.cos(aimAngle) * 46, LAUNCH.y + Math.sin(aimAngle) * 46);
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (flying) drawMarble(flying.x, flying.y, COLORS[flying.color], 1);
    if (currentBall != null) drawMarble(LAUNCH.x, LAUNCH.y, COLORS[currentBall], 0.9);
    if (nextBall != null) drawMarble(LAUNCH.x + 30, LAUNCH.y - 30, COLORS[nextBall], 0.65);

    pill('lv', `第${(curLevel ?? 0) + 1}关`); pill('score', `分数 ${score || 0}`);
    pill('left', `剩余 ${chain.length + queue.length}`);
  }

  RJ.loop((dt) => { pollKeys(); pollFireKey(); update(dt); }, draw);

  curLevel = 0; level = LEVELS[0]; path = buildPath(level.points); score = 0; running = false; elapsed = 0;
  chain = []; queue = genQueue(level.queueLen, level.colorCount);
  for (let i = 0; i < level.fill && queue.length; i++) chain.push({ color: queue.shift() });
  frontArc = (chain.length - 1) * SPACING; spawnTimer = level.spawnInterval;
  currentBall = 0; nextBall = 1; flying = null; cooldown = 0; aimAngle = -Math.PI / 2; particles = [];
})();
</script></body></html>
